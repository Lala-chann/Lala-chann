
name: GitHub Contribution Animation

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch GitHub contribution data
        run: node scripts/fetch-github.mjs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Commit updated contribution data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/github.json

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub contribution data"
            git push
          else
            echo "No contribution data changes."
          fi
